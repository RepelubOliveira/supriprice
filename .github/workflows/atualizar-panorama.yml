name: Atualizar Panorama do Diesel

# Roda de segunda a sexta. Dois horários porque a Abicom publica o boletim ao
# longo da manhã: se às 8h ainda não saiu, a segunda tentativa pega. Quando o
# boletim do dia não existe, o script sai sem publicar e o site continua com os
# dados anteriores — o selo do topo avisa o leitor da data.
on:
  schedule:
    - cron: '20 11 * * 1-5'   # 08:20 em Brasília
    - cron: '30 13 * * 1-5'   # 10:30 em Brasília (rede de segurança)
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só gerar o arquivo, sem publicar'
        type: boolean
        default: false
      backfill:
        description: 'Carregar histórico passado antes de atualizar'
        type: boolean
        default: false

# Duas execuções ao mesmo tempo poderiam gravar históricos conflitantes.
concurrency:
  group: atualizar-panorama
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # para commitar o histórico e o dados.js gerado

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Sem dependências: o script usa só o que vem no Node 20.
      - name: Carregar histórico da Abicom
        if: ${{ inputs.backfill }}
        run: node automacao/backfill.mjs --dias=30

      - name: Atualizar e publicar
        env:
          HTMLY_API_KEY: ${{ secrets.HTMLY_API_KEY }}
          HTMLY_SLUG: ${{ vars.HTMLY_SLUG || 'supriprice' }}
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then
            node automacao/atualizar.mjs --simular
          else
            node automacao/atualizar.mjs
          fi

      - name: Guardar o que mudou
        run: |
          git config user.name  "SupriPrice Bot"
          git config user.email "bot@supriprice.local"
          git add conteudo/historico.json conteudo/edicoes.json \
                  portal/assets/js/dados.js portal/relatorios/
          if git diff --staged --quiet; then
            echo "Nada mudou nesta execução."
          else
            git commit -m "portal: edição de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            # Outra execução pode ter commitado no meio do caminho.
            git pull --rebase --autostash || true
            git push
          fi
