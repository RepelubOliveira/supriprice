name: SupriPrice — reserva na nuvem

# RESERVA DO COMPUTADOR. A atualização principal roda no computador (Tarefa
# Agendada do Windows, 07h/12h/17h), o único lugar de onde a Abicom abre: o
# Cloudflare dela recusa servidores como os do GitHub (403).
#
# Meia hora depois de cada rodada do computador, esta reserva olha o site:
#   - se o computador já atualizou, não faz nada (termina em segundos);
#   - se não atualizou (desligado, fim de semana, feriado), ela atualiza:
#     notícias, cotações, ANP, market share, jornal do dia e selo. A
#     defasagem segue a do último boletim da Abicom, com a data à mostra.
#
# O estado de trabalho (último boletim, edições, análise da semana...) vem do
# próprio site (dados/estado.json), não do repositório — ver automacao/estado.mjs.
# Nada é commitado de volta.
#
# Custo: zero. Cada rodada leva 1 a 2 minutos, bem dentro da cota gratuita.
# Precisa do secret HTMLY_API_KEY (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: '30 10 * * *'   # 07:30 em Brasília
    - cron: '30 15 * * *'   # 12:30 em Brasília
    - cron: '30 20 * * *'   # 17:30 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Atualizar mesmo que o computador já tenha atualizado'
        type: boolean
        default: false

# Duas rodadas ao mesmo tempo poderiam publicar estados conflitantes.
concurrency:
  group: supriprice-atualizar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Fonte do jornal (a mesma família do site); o Chrome já vem na máquina.
      - name: Fontes do jornal
        run: sudo apt-get install -y -qq fonts-ibm-plex >/dev/null || true

      - name: Atualizar e publicar (só se o computador não tiver atualizado)
        env:
          HTMLY_API_KEY: ${{ secrets.HTMLY_API_KEY }}
          HTMLY_SLUG: ${{ vars.HTMLY_SLUG || 'supriprice' }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then
            node automacao/atualizar.mjs --nuvem --forcar
          else
            node automacao/atualizar.mjs --nuvem
          fi
