<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Compositor do vídeo SupriPrice</title>
<!--
  Monta o vídeo de divulgação quadro a quadro num <canvas> e codifica em MP4
  (H.264) com WebCodecs + mp4-muxer — sem ffmpeg, sem gravar a tela.

  POR QUE QUADRO A QUADRO E NÃO GRAVAÇÃO EM TEMPO REAL: o painel do navegador
  pode estar escondido; aí o requestAnimationFrame para e a gravação sai
  engasgada. Aqui cada quadro é desenhado e entregue ao codificador na hora
  exata dele (timestamp = n / 30 s), então o vídeo sai liso mesmo que o
  computador demore mais que 1/30 s para desenhar cada um.

  Entradas: video/capturas/ (geradas por capturar.js dentro do portal).
  Saída:    video/supriprice-vertical.mp4 e video/supriprice-horizontal.mp4,
            gravadas pelo POST /__gravar do servidor de apoio.

  Uso no console:  await Video.renderizar('vertical')
                   await Video.previa('vertical', [2, 8, 20])  // quadros soltos em PNG
-->
<style>
  body { margin: 0; background: #111; color: #ccc; font: 14px system-ui, sans-serif; }
  canvas { display: block; max-width: 100%; max-height: 90vh; margin: 0 auto; }
  #status { padding: 8px 12px; }
</style>
</head>
<body>
<div id="status">pronto</div>
<canvas id="quadro"></canvas>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js"></script>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------ constantes */

  var FPS = 30;
  var COR = {
    navy: '#0E2A47', navy2: '#16365A', navy3: '#27496F', navyFundo: '#0A2038',
    marca: '#B3341F', marcaClara: '#E0533A', salmao: '#FFB4A6',
    papel: '#F7F4EC', sobreNavy: '#C9D5E3', verde: '#9FE0BF', branco: '#FFFFFF'
  };
  var FONTE = 'Plex';

  /*
   * Zonas seguras. No vertical, o Instagram/TikTok cobrem o topo (~220 px:
   * nome da conta, "Reels") e a base (~360 px: legenda, música, botões), e os
   * ícones de curtir/comentar ficam na lateral direita da metade de baixo.
   * Nada importante vai nessas faixas.
   */
  var FORMATOS = {
    vertical: {
      W: 1080, H: 1920, pref: 'm',
      legenda: { x: 90, y: 250, w: 900, alinhar: 'left', kicker: 30, titulo: 70, sub: 34, maxLinhasTitulo: 2 },
      tela: { x: 110, y: 610, w: 860, h: 950, raio: 36, barra: 66 },
      faixaY: 1330, faixaH: 84,
      logoAbertura: { cy: 520, h: 96 },
      bitrate: 12e6
    },
    horizontal: {
      W: 1920, H: 1080, pref: 'd',
      legenda: { x: 110, centroY: 560, w: 560, alinhar: 'left', kicker: 24, titulo: 60, sub: 28, maxLinhasTitulo: 3 },
      tela: { x: 760, y: 110, w: 1060, h: 860, raio: 22, barra: 54 },
      faixaY: 820, faixaH: 76,
      logoAbertura: { cy: 300, h: 84 },
      logoCanto: { x: 110, y: 84, h: 34 },
      bitrate: 12e6
    }
  };

  /* --------------------------------------------------------------- utilidades */

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  /** Progresso 0→1 entre `ini` e `ini + dur`. */
  function fase(t, ini, dur) { return clamp((t - ini) / dur, 0, 1); }
  /** Suaviza entrada e saída (cúbica). */
  function suave(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  /** Sai rápido e freia (para coisas que "chegam"). */
  function chega(p) { return 1 - Math.pow(1 - p, 3); }

  function fonte(peso, tam) { return peso + ' ' + tam + 'px ' + FONTE; }

  function retRedondo(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /** Quebra `texto` em linhas que caibam em `max` px com a fonte atual. */
  function quebrar(ctx, texto, max) {
    var palavras = String(texto).split(/\s+/), linhas = [], atual = '';
    palavras.forEach(function (p) {
      var teste = atual ? atual + ' ' + p : p;
      if (ctx.measureText(teste).width > max && atual) { linhas.push(atual); atual = p; }
      else atual = teste;
    });
    if (atual) linhas.push(atual);
    return linhas;
  }

  function carregarImagem(src) {
    return new Promise(function (ok, erro) {
      var i = new Image();
      i.onload = function () { ok(i); };
      i.onerror = function () { erro(new Error('não carregou ' + src)); };
      i.src = src;
    });
  }

  function status(msg) { document.getElementById('status').textContent = msg; }

  /* ------------------------------------------------------------- recursos */

  var R = {};   // imagens e mapas carregados por formato
  var fontesCarregadas = false;

  async function preparar(nome) {
    var F = FORMATOS[nome];
    // NÃO use document.fonts.check() aqui: para uma família que ainda nem foi
    // registrada ele responde "true" (nada pendente), e as legendas saíam em
    // Times. Um sinalizador próprio é o que garante o carregamento.
    if (!fontesCarregadas) {
      var faces = [
        new FontFace(FONTE, 'url(/portal/assets/fonts/plex-latin.woff2)', { weight: '100 900' }),
        new FontFace(FONTE, 'url(/portal/assets/fonts/plex-latin-ext.woff2)', { weight: '100 900' })
      ];
      for (var i = 0; i < faces.length; i++) document.fonts.add(await faces[i].load());
      fontesCarregadas = true;
    }
    var cache = '?t=' + Date.now();
    // Os números do quadro de mercado vêm do mesmo dados.js do portal — a
    // faixa (foto) e o quadro (desenhado) mostram exatamente os mesmos valores.
    if (!window.DADOS) {
      await new Promise(function (ok, erro) {
        var s = document.createElement('script');
        s.src = '/portal/assets/js/dados.js' + cache;
        s.onload = ok; s.onerror = function () { erro(new Error('dados.js não carregou')); };
        document.head.appendChild(s);
      });
    }
    var mapa = await fetch('/video/capturas/' + F.pref + '_mapa.json' + cache).then(function (r) { return r.json(); });
    var jornalMapa = await fetch('/video/capturas/jornal_mapa.json' + cache).then(function (r) { return r.json(); });
    var p = F.pref;
    var imgs = await Promise.all([
      carregarImagem('/video/capturas/' + p + '_topo.png' + cache),
      carregarImagem('/video/capturas/' + p + '_painel.png' + cache),
      carregarImagem('/video/capturas/' + p + '_noticias.png' + cache),
      carregarImagem('/video/capturas/' + p + '_faixa.png' + cache),
      carregarImagem('/video/capturas/jornal.png' + cache),
      carregarImagem('/portal/assets/supriprice-logo.png')
    ]);
    R[nome] = {
      mapa: mapa,
      topo: { img: imgs[0], css: mapa.capturas.topo, fundo: COR.navy },
      painel: { img: imgs[1], css: mapa.capturas.painel, fundo: COR.papel },
      noticias: { img: imgs[2], css: mapa.capturas.noticias, fundo: COR.papel },
      faixa: { img: imgs[3], css: mapa.capturas.faixa },
      jornal: { img: imgs[4], css: jornalMapa },
      logo: imgs[5]
    };
    var c = document.getElementById('quadro');
    c.width = F.W; c.height = F.H;
    return R[nome];
  }

  /* ------------------------------------------------------ peças de desenho */

  function fundo(ctx, F, T) {
    var g = ctx.createLinearGradient(0, 0, 0, F.H);
    g.addColorStop(0, COR.navy);
    g.addColorStop(1, COR.navyFundo);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, F.W, F.H);
    // Brilho vermelho que deriva devagar: dá vida sem distrair.
    var cx = F.W * 0.82 + Math.sin(T * 0.25) * F.W * 0.05;
    var cy = F.H * 0.12 + Math.cos(T * 0.2) * F.H * 0.03;
    var r = Math.max(F.W, F.H) * 0.55;
    var gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    gr.addColorStop(0, 'rgba(179,52,31,0.28)');
    gr.addColorStop(1, 'rgba(179,52,31,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, F.W, F.H);
    var gb = ctx.createRadialGradient(F.W * 0.1, F.H * 0.95, 0, F.W * 0.1, F.H * 0.95, r * 0.8);
    gb.addColorStop(0, 'rgba(39,73,111,0.55)');
    gb.addColorStop(1, 'rgba(39,73,111,0)');
    ctx.fillStyle = gb;
    ctx.fillRect(0, 0, F.W, F.H);
  }

  function logoCanto(ctx, F, alfa) {
    if (!F.logoCanto) return;
    var L = R[F.nome].logo, h = F.logoCanto.h, w = L.width * h / L.height;
    ctx.globalAlpha = alfa;
    ctx.drawImage(L, F.logoCanto.x, F.logoCanto.y, w, h);
    ctx.globalAlpha = 1;
  }

  /** Mede e desenha o bloco kicker + título + subtítulo. */
  function blocoLegenda(ctx, F, cap, alfa, dy) {
    var L = F.legenda;
    var tamT = L.titulo, linhasT;
    ctx.font = fonte(700, tamT);
    linhasT = quebrar(ctx, cap.titulo, L.w);
    while (linhasT.length > L.maxLinhasTitulo && tamT > 40) {
      tamT = Math.round(tamT * 0.92);
      ctx.font = fonte(700, tamT);
      linhasT = quebrar(ctx, cap.titulo, L.w);
    }
    ctx.font = fonte(500, L.sub);
    var linhasS = cap.sub ? quebrar(ctx, cap.sub, L.w) : [];
    var altKicker = cap.kicker ? L.kicker * 1.2 + 18 : 0;
    var altT = linhasT.length * tamT * 1.12;
    var altS = linhasS.length ? 16 + linhasS.length * L.sub * 1.32 : 0;
    var total = altKicker + altT + altS;
    var y = (L.centroY != null ? L.centroY - total / 2 : L.y) + dy;

    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.textBaseline = 'top';
    if (cap.kicker) {
      ctx.font = fonte(700, L.kicker);
      ctx.fillStyle = COR.salmao;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
      ctx.fillText(cap.kicker.toUpperCase(), L.x, y);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      // Filete vermelho sob o kicker, como nas seções do portal.
      ctx.fillStyle = COR.marcaClara;
      ctx.fillRect(L.x, y + L.kicker * 1.2 + 6, 56, 4);
      y += altKicker;
    }
    ctx.font = fonte(700, tamT);
    ctx.fillStyle = COR.branco;
    linhasT.forEach(function (l, i) { ctx.fillText(l, L.x, y + i * tamT * 1.12); });
    y += altT;
    if (linhasS.length) {
      ctx.font = fonte(500, L.sub);
      ctx.fillStyle = COR.sobreNavy;
      linhasS.forEach(function (l, i) { ctx.fillText(l, L.x, y + 16 + i * L.sub * 1.32); });
    }
    ctx.restore();
  }

  /**
   * Legendas que trocam dentro de uma cena: [{t, kicker, titulo, sub}].
   * A anterior some em 0,25 s enquanto a nova sobe e aparece.
   */
  function legendas(ctx, F, lista, t) {
    var i = 0;
    for (var k = 0; k < lista.length; k++) if (t >= lista[k].t) i = k;
    var nova = lista[i];
    if (i > 0 && t < nova.t + 0.25) {
      blocoLegenda(ctx, F, lista[i - 1], 1 - fase(t, nova.t, 0.25), 0);
    }
    var p = chega(fase(t, nova.t + (i > 0 ? 0.15 : 0.1), 0.5));
    blocoLegenda(ctx, F, nova, p, (1 - p) * 26);
  }

  /** Aproximação da câmera: interpola uma sequência de enquadramentos. */
  function camera(keys, t) {
    var c = { x: keys[0].x, y: keys[0].y, w: keys[0].w };
    for (var k = 1; k < keys.length; k++) {
      var p = suave(fase(t, keys[k].t, keys[k].dur || 1.2));
      c = { x: lerp(c.x, keys[k].x, p), y: lerp(c.y, keys[k].y, p), w: lerp(c.w, keys[k].w, p) };
    }
    return c;
  }

  /** Proporção altura/largura da área útil da tela (abaixo da barra de endereço). */
  function aspecto(F) { return (F.tela.h - F.tela.barra) / F.tela.w; }

  /** Enquadramento que mostra o retângulo `r` com folga `m`, dentro da captura. */
  function foco(F, cap, r, m, opcoes) {
    opcoes = opcoes || {};
    var asp = aspecto(F);
    var w = opcoes.w || Math.min(cap.css.w, r.w + 2 * m);
    var h = w * asp;
    var x = r.x + r.w / 2 - w / 2;
    var y = opcoes.topo ? r.y - m : r.y + r.h / 2 - h / 2;
    x = clamp(x, 0, Math.max(0, cap.css.w - w));
    y = clamp(y, 0, Math.max(0, cap.css.h - h));
    return { x: x, y: y, w: w };
  }

  /** Moldura de navegador com a captura enquadrada pela câmera. */
  function tela(ctx, F, cap, cam, destaques, alfa, dy) {
    var T = F.tela, x = T.x, y = T.y + dy, w = T.w, h = T.h;
    ctx.save();
    ctx.globalAlpha = alfa;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    retRedondo(ctx, x, y, w, h, T.raio);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();

    ctx.save();
    retRedondo(ctx, x, y, w, h, T.raio);
    ctx.clip();

    // Barra de endereço: deixa claro que é um SITE, e qual.
    ctx.fillStyle = '#ECE8DE';
    ctx.fillRect(x, y, w, T.barra);
    var pilW = Math.min(w * 0.62, 520), pilH = T.barra * 0.56;
    var px = x + (w - pilW) / 2, py = y + (T.barra - pilH) / 2;
    retRedondo(ctx, px, py, pilW, pilH, pilH / 2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.fillStyle = '#55606E';
    ctx.font = fonte(600, Math.round(pilH * 0.52));
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText('🔒 www.supriprice.com.br', px + pilW / 2, py + pilH / 2 + 1);
    ctx.textAlign = 'left';
    if (F.nome === 'horizontal') {
      ['#E0533A', '#E7B04A', '#58B17B'].forEach(function (c, i) {
        ctx.beginPath(); ctx.arc(x + 28 + i * 22, y + T.barra / 2, 7, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill();
      });
    }

    // Conteúdo
    var y0 = y + T.barra, hC = h - T.barra;
    ctx.fillStyle = cap.fundo || COR.papel;
    ctx.fillRect(x, y0, w, hC);
    var s = cap.img.width / cap.css.w;          // px da imagem por px de CSS
    var camH = cam.w * hC / w;
    var sx = cam.x * s, sy = cam.y * s, sw = cam.w * s, sh = camH * s;
    // Recorta a origem aos limites da imagem, mantendo a proporção no destino.
    var cy0 = Math.max(0, sy), cy1 = Math.min(cap.img.height, sy + sh);
    var cx0 = Math.max(0, sx), cx1 = Math.min(cap.img.width, sx + sw);
    if (cy1 > cy0 && cx1 > cx0) {
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(cap.img, cx0, cy0, cx1 - cx0, cy1 - cy0,
        x + (cx0 - sx) / sw * w, y0 + (cy0 - sy) / sh * hC,
        (cx1 - cx0) / sw * w, (cy1 - cy0) / sh * hC);
    }

    // Destaques: contorno que pulsa em volta da área comentada.
    var k = w / cam.w;
    (destaques || []).forEach(function (d) {
      if (!d.r || d.a <= 0) return;
      var rx = x + (d.r.x - cam.x) * k, ry = y0 + (d.r.y - cam.y) * k;
      var rw = d.r.w * k, rh = d.r.h * k;
      ctx.save();
      ctx.globalAlpha = alfa * d.a;
      ctx.shadowColor = COR.marcaClara; ctx.shadowBlur = 24;
      ctx.lineWidth = 6; ctx.strokeStyle = COR.marcaClara;
      retRedondo(ctx, rx - 6, ry - 6, rw + 12, rh + 12, 14);
      ctx.stroke();
      ctx.restore();
    });
    ctx.restore();
    ctx.restore();
  }

  /** Faixa de cotações passando, desenhada da foto de UMA volta repetida. */
  function faixa(ctx, F, y, altura, T, alfa, largura, x0) {
    var f = R[F.nome].faixa, esc = altura / f.img.height;
    var passo = f.img.width * esc;
    var x = x0 != null ? x0 : 0, w = largura != null ? largura : F.W;
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    retRedondo(ctx, x, y, w, altura, 18);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.restore();
    retRedondo(ctx, x, y, w, altura, 18);
    ctx.clip();
    var desloc = (T * 70 * esc) % passo;         // ~70 px de CSS por segundo
    for (var px = x - desloc; px < x + w; px += passo) {
      ctx.drawImage(f.img, px, y, passo, altura);
    }
    // Pontas esmaecidas, como no portal.
    [[x, 0], [x + w - 60, 1]].forEach(function (p) {
      var g = ctx.createLinearGradient(p[0], 0, p[0] + 60, 0);
      g.addColorStop(p[1] ? 0 : 1, 'rgba(255,255,255,0)');
      g.addColorStop(p[1] ? 1 : 0, 'rgba(255,255,255,1)');
      ctx.fillStyle = g; ctx.fillRect(p[0], y, 60, altura);
    });
    ctx.restore();
  }

  function pilula(ctx, texto, cx, cy, tam, cor, fundoCor, alfa, escala) {
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.font = fonte(700, tam);
    var w = ctx.measureText(texto).width + tam * 1.4, h = tam * 1.9;
    ctx.translate(cx, cy); ctx.scale(escala, escala);
    ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    retRedondo(ctx, -w / 2, -h / 2, w, h, h / 2);
    ctx.fillStyle = fundoCor; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = cor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(texto, 0, 1);
    ctx.restore();
    return w;
  }

  /* ------------------------------------------------------------------ cenas */
  /* Cada cena: { dur, desenhar(ctx, F, t, T, alfa) }. t = tempo na cena,
     T = tempo global. alfa = entrada/saída da cena. */

  function entradaTela(t) { var p = chega(fase(t, 0, 0.7)); return { a: p, dy: (1 - p) * 70 }; }

  function cenas(F) {
    var nome = F.nome, V = nome === 'vertical', rs = R[nome];
    var topo = rs.topo, painel = rs.painel, noticias = rs.noticias, jornal = rs.jornal;
    var dt = topo.css.destaques, dp = painel.css.destaques, dn = noticias.css.destaques;

    // Enquadramentos (em px de CSS de cada captura)
    var inteiroTopo = V ? { x: 0, y: 0, w: topo.css.w } : { x: 0, y: 0, w: topo.css.w };
    var camDiesel = foco(F, topo, dt.diesel, V ? 14 : 30, V ? {} : { w: dt.diesel.w * 1.55 });
    var camPolo = foco(F, topo, dt.polo || dt.ticker, V ? 16 : 40, V ? {} : { w: dt.ticker.w * 1.6 });

    var camGrafico = foco(F, painel, dp.grafico, V ? 0 : 10, { topo: true });
    var camRegioes = foco(F, painel, dp.regioes, V ? 0 : 10, { topo: true });
    var areaBomba = {                      // bomba + estados juntos
      x: Math.min(dp.bomba.x, dp.estados.x), y: Math.min(dp.bomba.y, dp.estados.y),
      w: Math.max(dp.bomba.x + dp.bomba.w, dp.estados.x + dp.estados.w) - Math.min(dp.bomba.x, dp.estados.x),
      h: Math.max(dp.bomba.y + dp.bomba.h, dp.estados.y + dp.estados.h) - Math.min(dp.bomba.y, dp.estados.y)
    };
    var camBomba = foco(F, painel, areaBomba, V ? 0 : 10, { topo: true });

    // No celular, o painel e as notícias vêm sem margem lateral (a margem é do
    // contêiner, que fica fora da foto): o texto encostaria na moldura. Estes
    // enquadramentos abrem uma folga de cada lado — a área fora da foto é
    // preenchida com a cor de fundo do site.
    var FOLGA = 18;
    function larga(cap, y) { return { x: -FOLGA, y: y, w: cap.css.w + 2 * FOLGA }; }
    if (V) {
      camGrafico = larga(painel, Math.max(0, dp.grafico.y - 10));
      camRegioes = { x: -painel.css.w * 0.15, y: Math.max(0, dp.regioes.y - 10), w: painel.css.w * 1.3 };
      camBomba = larga(painel, Math.max(0, dp.bomba.y - 10));
    }

    var edt = function (n) { return dn[n] || { x: 0, y: 0, w: noticias.css.w, h: 400 }; };
    var camMundo = V ? larga(noticias, edt('mundo').y) : null;
    var camBrasil = V ? larga(noticias, edt('brasil').y) : null;
    var camTransp = V ? larga(noticias, edt('transporte').y) : null;
    if (!V) {
      // No computador as editorias ficam lado a lado: a câmera passeia pela grade.
      // Folga à esquerda: a foto das notícias começa colada no texto.
      camMundo = { x: -24, y: 0, w: noticias.css.w * 0.62 };

  /* ----------------------------------------------------------- linha do tempo */

  var roteiro = {};   // por formato: { cenas, inicios, total }

  function montarRoteiro(nome) {
    var F = Object.assign({ nome: nome }, FORMATOS[nome]);
    var lista = cenas(F), inicios = [], acc = 0;
    lista.forEach(function (c) { inicios.push(acc); acc += c.dur; });
    roteiro[nome] = { F: F, cenas: lista, inicios: inicios, total: acc };
    return roteiro[nome];
  }

  /** Desenha o quadro do instante T (segundos) no canvas. */
  function desenharQuadro(ctx, nome, T) {
    var r = roteiro[nome], F = r.F;
    fundo(ctx, F, T);
    for (var i = 0; i < r.cenas.length; i++) {
      var ini = r.inicios[i], c = r.cenas[i];
      if (T < ini || T >= ini + c.dur) continue;
      var t = T - ini;
      var entra = i === 0 ? 1 : fase(t, 0, 0.35);
      var sai = i === r.cenas.length - 1 ? 1 : 1 - fase(t, c.dur - 0.35, 0.35);
      c.desenhar(ctx, F, t, T, entra * sai);
    }
  }

  /* ------------------------------------------------------------- saída */

  function gravar(caminho, corpo) {
    return fetch('/__gravar?path=' + encodeURIComponent(caminho), { method: 'POST', body: corpo })
      .then(function (r) { if (!r.ok) throw new Error('gravar ' + caminho + ': HTTP ' + r.status); return r.text(); });
  }

  async function previa(nome, tempos) {
    await preparar(nome);
    var r = montarRoteiro(nome);
    var c = document.getElementById('quadro'), ctx = c.getContext('2d');
    var salvos = [];
    for (var i = 0; i < tempos.length; i++) {
      desenharQuadro(ctx, nome, tempos[i]);
      var blob = await new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.9); });
      var arq = 'video/capturas/previa-' + nome + '-' + String(tempos[i]).replace('.', '_') + '.jpg';
      await gravar(arq, blob);
      salvos.push(arq);
    }
    return { total: r.total, salvos: salvos };
  }

  var progresso = { estado: 'parado' };

  async function renderizar(nome) {
    progresso = { estado: 'preparando', formato: nome };
    await preparar(nome);
    var r = montarRoteiro(nome), F = r.F;
    var c = document.getElementById('quadro'), ctx = c.getContext('2d', { alpha: false });
    var quadros = Math.round(r.total * FPS);

    // Codec: H.264 High, do nível mais alto que o navegador aceitar. 1080x1920
    // estoura o nível 4.0 por pouco; 5.1/5.0/4.2 cobrem com folga.
    var codec = null;
    var candidatos = ['avc1.640033', 'avc1.640032', 'avc1.64002A', 'avc1.640028'];
    for (var i = 0; i < candidatos.length && !codec; i++) {
      var s = await VideoEncoder.isConfigSupported({ codec: candidatos[i], width: F.W, height: F.H, bitrate: F.bitrate, framerate: FPS });
      if (s.supported) codec = candidatos[i];
    }
    if (!codec) throw new Error('Nenhum perfil H.264 aceito para ' + F.W + 'x' + F.H);

    var muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width: F.W, height: F.H, frameRate: FPS },
      fastStart: 'in-memory'
    });
    var erroCod = null;
    var enc = new VideoEncoder({
      output: function (chunk, meta) { muxer.addVideoChunk(chunk, meta); },
      error: function (e) { erroCod = e; }
    });
    enc.configure({ codec: codec, width: F.W, height: F.H, bitrate: F.bitrate, framerate: FPS,
      latencyMode: 'quality', avc: { format: 'avc' } });

    var inicio = performance.now();
    for (var n = 0; n < quadros; n++) {
      if (erroCod) throw erroCod;
      desenharQuadro(ctx, nome, n / FPS);
      var vf = new VideoFrame(c, { timestamp: Math.round(n * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: n % (FPS * 2) === 0 });
      vf.close();
      // Sem setTimeout: em aba escondida ele é estrangulado. Espera o
      // codificador esvaziar a fila pelo evento dele.
      while (enc.encodeQueueSize > 6) {
        await new Promise(function (ok) { enc.addEventListener('dequeue', ok, { once: true }); });
      }
      if (n % 30 === 0) {
        progresso = { estado: 'codificando', formato: nome, quadro: n, de: quadros };
        status(nome + ': quadro ' + n + ' de ' + quadros);
      }
    }
    await enc.flush();
    if (erroCod) throw erroCod;
    muxer.finalize();
    var buf = muxer.target.buffer;
    var arquivo = 'video/supriprice-' + nome + '.mp4';
    await gravar(arquivo, new Blob([buf], { type: 'video/mp4' }));

    // Capa para a postagem: o quadro de 2,6 s (logo + frase de abertura).
    desenharQuadro(ctx, nome, 2.6);
    var capa = await new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.92); });
    await gravar('video/capa-' + nome + '.jpg', capa);

    progresso = {
      estado: 'pronto', formato: nome, arquivo: arquivo, bytes: buf.byteLength,
      segundos: +(quadros / FPS).toFixed(2), codec: codec, quadros: quadros,
      levou: +((performance.now() - inicio) / 1000).toFixed(1)
    };
    status(nome + ': pronto (' + (buf.byteLength / 1048576).toFixed(1) + ' MB)');
    return progresso;
  }

  window.Video = {
    previa: previa,
    renderizar: renderizar,
    progresso: function () { return progresso; },
    duracao: function (nome) { return montarRoteiro(nome).total; }
  };
})();
